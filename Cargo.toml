[package]
name = "wdid"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
calcard = "0.3"
chrono = "0.4"
chrono-tz = "0.10"
directories = "6.0.0"
eframe = "0.32.0"
egui = "0.32.0"
egui_commonmark = "0.21"
reqwest = { version = "0.12", features = ["rustls-tls"] }
rrule = "0.14"
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.18"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
toml = "0.9.11"
